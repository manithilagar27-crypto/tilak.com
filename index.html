<!DOCTYPE html>
<html>
<head>
    <title>Tilak Website</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background: blue;
            color: white;
            border: none;
        }

        #profile {
            display: none;
        }

        #profile img {
            width: 200px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box" id="login">
    <h2>Tilak Website</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <br>

    <button onclick="login()">Login</button>

    <p id="message"></p>
</div>

<div class="box" id="profile">
    <h2>Welcome, Tilak!</h2>

    <img src="myphoto.jpg" alt="My Picture">

    <p>Login Successful!</p>
</div>

<script>
function login() {

    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;

    if (username === "tilak" && password === "12345") {

        document.getElementById("login").style.display = "none";
        document.getElementById("profile").style.display = "block";

    } else {

        document.getElementById("message").innerHTML =
            "Invalid Username or Password";
    }
}
</script>

</body>
</html>
